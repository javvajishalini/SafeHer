spring:
  application:
    name: SafeHer
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/safeher}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:825c866d9294ff1929bd7d8df981df1b306fc6e2320b9dfbe5412dc08ebc4349}
  expiration: 86400000

ai:
  api:
    key: ${AI_API_KEY:}
    url: ${AI_API_URL:https://generativelanguage.googleapis.com/v1beta}
    model: ${AI_MODEL:gemini-2.0-flash}
    enabled: ${AI_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

safeher:
  sms:
    enabled: ${SMS_ENABLED:false}
    provider: ${SMS_PROVIDER:twilio}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
